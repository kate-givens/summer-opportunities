name: Sync Notion
on:
  schedule:
    - cron: "0 * * * *"   # hourly
  workflow_dispatch:        # "Run workflow" button for instant updates
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node sync.mjs
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
      - name: Commit if changed
        run: |
          git config user.name "notion-sync"
          git config user.email "actions@users.noreply.github.com"
          git add programs.json
          git diff --cached --quiet || (git commit -m "Update programs" && git push)
